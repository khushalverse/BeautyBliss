<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beauty Bliss | Premium Links</title>
  <meta name="theme-color" content="#fef8fa">
  <link rel="icon" type="image/png" href="../assets/logo.webp">
  <style>
    :root {
      --blush-bg: #fef8fa;
      --pink-primary: #ff8da1;
      --pink-gradient: linear-gradient(145deg, #ffb6c1, #ff8da1);
      --glass-light: rgba(255, 255, 255, 0.4);
      --glass-border: rgba(255, 255, 255, 0.8);
      --shadow-color: rgba(220, 180, 190, 0.4);
      --text-dark: #3a2e32;
      --text-muted: #a8949b;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--blush-bg);
      color: var(--text-dark);
      perspective: 1000px;
    }

    /* Deep Luxury Atmosphere */
    .atmosphere {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 50% 20%, #ffffff 0%, #fef8fa 60%, #fdf0f4 100%);
    }

    .glass-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: driftBlob 20s infinite alternate ease-in-out;
    }

    .blob-1 { width: 400px; height: 400px; background: rgba(255, 182, 193, 0.3); top: -100px; left: -100px; }
    .blob-2 { width: 300px; height: 300px; background: rgba(230, 210, 255, 0.3); bottom: 10vh; right: -50px; animation-delay: -5s; }

    @keyframes driftBlob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, -50px) scale(1.1); }
    }

    /* Particle Sparkles */
    .particle-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    
    .bg-particles { z-index: 2; opacity: 0.5; }
    .fg-particles { z-index: 20; opacity: 0.8; }

    .sparkle {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 12px 2px rgba(255, 255, 255, 0.9);
      opacity: 0;
      animation: floatSparkle 6s infinite ease-in-out;
    }

    @keyframes floatSparkle {
      0% { transform: translateY(0) scale(0); opacity: 0; }
      50% { opacity: 1; transform: translateY(-30px) scale(1.5); }
      100% { transform: translateY(-60px) scale(0); opacity: 0; }
    }

    .floating-pearl {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #ffe6f0 50%, #ffb6c1 100%);
      box-shadow: 0 5px 15px rgba(255, 180, 200, 0.5), inset -2px -2px 6px rgba(200, 100, 130, 0.2), inset 2px 2px 6px rgba(255, 255, 255, 0.9);
      opacity: 0.8;
      animation: driftPearl 12s infinite alternate ease-in-out;
    }

    @keyframes driftPearl {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -40px) scale(1.1); }
    }

    /* Canvas Layout */
    .canvas {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 24px 80px 24px; 
    }

    /* 3D INTERACTIVE COMPACT MIRROR */
    .compact-wrapper {
      position: relative;
      margin-bottom: 28px;
      perspective: 1000px;
      transform-style: preserve-3d;
    }

    .compact-hero {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: #fff;
      transform-style: preserve-3d;
      transition: transform 0.1s linear, box-shadow 0.1s linear;
      box-shadow: 
        0 45px 90px rgba(220, 160, 180, 0.45), 
        inset 0 0 0 6px rgba(255, 245, 248, 1), 
        inset 0 0 0 8px rgba(230, 200, 210, 0.8), 
        inset 0 0 35px rgba(0,0,0,0.15); 
      will-change: transform;
    }

    .profile-img {
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      width: calc(100% - 16px);
      height: calc(100% - 16px);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.2);
      transform: translateZ(2px);
    }

    .founder-badge {
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%) translateZ(20px);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #c98a98;
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 15px 30px rgba(200, 160, 170, 0.3);
      z-index: 20;
      white-space: nowrap;
    }

    /* Branding Typography */
    .brand-title {
      font-family: "Didot", "Bodoni MT", "Times New Roman", serif;
      font-size: 38px;
      font-weight: 700;
      font-style: italic;
      color: var(--text-dark);
      margin-bottom: 8px;
      text-align: center;
      text-shadow: 0 15px 30px rgba(200, 150, 160, 0.3);
      letter-spacing: -0.5px;
    }

    .brand-tagline {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 48px;
    }

    /* Primary CTA: Enhanced Luxury Cosmetic Product */
    .btn-primary {
      position: relative;
      width: 100%;
      max-width: 320px;
      padding: 22px;
      border-radius: 40px; 
      background: linear-gradient(145deg, #ffc2cc, #ff8da1, #ff6b8b);
      background-size: 200% 200%;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      overflow: hidden;
      transition: all var(--ease-spring);
      box-shadow: 
        0 35px 70px rgba(255, 120, 150, 0.5), 
        0 10px 20px rgba(255, 120, 150, 0.3), 
        inset 0 8px 20px rgba(255, 255, 255, 0.95), 
        inset 0 -8px 20px rgba(200, 40, 70, 0.3); 
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent);
      transform: skewX(-25deg);
      animation: glossySwipe 5s infinite;
      pointer-events: none;
    }

    @keyframes glossySwipe {
      0%, 40% { left: -100%; }
      60%, 100% { left: 200%; }
    }

    .btn-primary span, .btn-primary svg {
      position: relative;
      z-index: 2;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15); 
    }

    .btn-primary:active {
      transform: scale(0.95) translateY(4px);
      box-shadow: 
        0 15px 30px rgba(255, 120, 150, 0.4),
        0 5px 10px rgba(255, 120, 150, 0.3),
        inset 0 4px 12px rgba(255, 255, 255, 0.9),
        inset 0 -4px 12px rgba(200, 40, 70, 0.4);
    }

    /* Secondary CTA: Enhanced Glass */
    .btn-secondary {
      margin-top: 24px;
      padding: 16px 36px;
      border-radius: 30px;
      background: var(--glass-light);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      color: #6a5a60;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 15px 35px rgba(200, 180, 190, 0.2), inset 0 2px 4px rgba(255,255,255,0.6);
      transition: all var(--ease-spring);
    }

    .btn-secondary:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.7);
    }

    /* THE FLOATING PEARL NAVIGATION */
    .pearl-nav-container {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The Main Pearl */
    .pearl {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff0f5 30%, #ffb6c1 70%, #ff8da1 100%);
      box-shadow: 
        0 20px 40px rgba(255, 150, 170, 0.4),
        inset -5px -5px 15px rgba(200, 80, 120, 0.2),
        inset 5px 5px 15px rgba(255, 255, 255, 0.9);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s var(--ease-spring), box-shadow 0.4s ease;
      animation: floatPearl 6s ease-in-out infinite alternate;
      z-index: 110;
    }

    .pearl::after {
      content: '';
      position: absolute;
      top: 10%; left: 20%;
      width: 15px; height: 10px;
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      transform: rotate(-30deg);
      filter: blur(1px);
    }

    @keyframes floatPearl {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .pearl:active {
      transform: scale(0.9);
      box-shadow: 0 10px 20px rgba(255, 150, 170, 0.3);
    }

    /* The glowing core icon */
    .pearl svg {
      width: 24px;
      height: 24px;
      fill: #fff;
      filter: drop-shadow(0 2px 4px rgba(255,100,130,0.4));
      transition: transform 0.4s var(--ease-spring);
    }

    /* Petal Links (Mini Glass Buttons) */
    .petal {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 10px 25px rgba(200, 150, 160, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dark);
      text-decoration: none;
      opacity: 0;
      pointer-events: none;
      transform: scale(0) translate(0, 0);
      transition: all 0.5s var(--ease-spring);
      z-index: 105;
    }

    .petal svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Open State */
    .pearl-nav-container.open .pearl svg {
      transform: rotate(45deg); /* Turns core into an X or starburst */
    }

    /* Positioning petals in an arc */
    .pearl-nav-container.open .petal-1 {
      opacity: 1; pointer-events: auto;
      transform: scale(1) translate(-70px, -20px);
      transition-delay: 0.05s;
    }
    
    .pearl-nav-container.open .petal-2 {
      opacity: 1; pointer-events: auto;
      transform: scale(1) translate(0, -80px);
      transition-delay: 0.1s;
    }

    .pearl-nav-container.open .petal-3 {
      opacity: 1; pointer-events: auto;
      transform: scale(1) translate(70px, -20px);
      transition-delay: 0.15s;
    }

    /* Hover on petals */
    .petal:hover, .petal:active {
      background: #fff;
      transform: scale(1.15) translate(var(--tx), var(--ty)) !important; /* Will set tx/ty in JS for proper hover zoom */
      color: #ff8da1;
      box-shadow: 0 15px 30px rgba(255, 140, 160, 0.4);
    }
    .petal.ig:hover { color: #e1306c; }
    .petal.wa:hover { color: #25D366; }

  </style>
</head>

  <script>
    // Atmosphere generation
    function createSparkles(containerId, count, sizeRange) {
      const container = document.getElementById(containerId);
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'sparkle';
        p.style.left = `${Math.random() * 100}%`;
        p.style.top = `${Math.random() * 100}%`;
        
        const size = sizeRange[0] + Math.random() * (sizeRange[1] - sizeRange[0]);
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        
        p.style.animationDelay = `${Math.random() * -6}s`;
        p.style.animationDuration = `${4 + Math.random() * 4}s`;
        
        container.appendChild(p);
      }
    }

    function createPearls(containerId, count) {
      const container = document.getElementById(containerId);
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'floating-pearl';
        p.style.left = `${Math.random() * 100}%`;
        p.style.top = `${Math.random() * 100}%`;
        
        const size = 5 + Math.random() * 7; 
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        
        p.style.animationDelay = `${Math.random() * -10}s`;
        p.style.animationDuration = `${8 + Math.random() * 6}s`;
        
        container.appendChild(p);
      }
    }

    createSparkles('bg-particles', 25, [1, 4]); // Increased amount and size slightly
    createSparkles('fg-particles', 15, [2, 5]);
    createPearls('bg-particles', 12); // Add floating pearls for luxury depth

    // INTERACTIVE 3D COMPACT MIRROR (Tilt Effect)
    const compact = document.getElementById('compact');
    const glare = document.getElementById('glare');
    const MAX_TILT = 15; // Max rotation in degrees

    function handleMove(clientX, clientY) {
      const rect = compact.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      const percentX = (clientX - centerX) / (window.innerWidth / 2);
      const percentY = -(clientY - centerY) / (window.innerHeight / 2);
      
      const tiltX = Math.max(Math.min(percentY * MAX_TILT, MAX_TILT), -MAX_TILT);
      const tiltY = Math.max(Math.min(percentX * MAX_TILT, MAX_TILT), -MAX_TILT);

      compact.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
    }

    // Mouse tilt
    document.addEventListener('mousemove', (e) => {
      handleMove(e.clientX, e.clientY);
    });

    // Device accelerometer tilt (Mobile)
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (e) => {
        // Use gamma (left/right) and beta (front/back)
        if (e.gamma !== null && e.beta !== null) {
          const tiltY = Math.max(Math.min(e.gamma / 2, MAX_TILT), -MAX_TILT);
          const tiltX = Math.max(Math.min((e.beta - 45) / 2, MAX_TILT), -MAX_TILT);
          compact.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
        }
      });
    }

    // Reset on leave
    document.addEventListener('mouseleave', () => {
      compact.style.transform = `rotateX(0deg) rotateY(0deg)`;
    });

    // PEARL NAVIGATION MENU INTERACTION
    const pearlContainer = document.getElementById('pearlNav');
    const pearlBtn = document.querySelector('.pearl');
    
    // Set proper transform variables on petals so hover scaling works correctly on transformed elements
    const petals = document.querySelectorAll('.petal');
    petals.forEach(petal => {
      if(petal.classList.contains('petal-1')) { petal.style.setProperty('--tx', '-70px'); petal.style.setProperty('--ty', '-20px'); }
      if(petal.classList.contains('petal-2')) { petal.style.setProperty('--tx', '0px'); petal.style.setProperty('--ty', '-80px'); }
      if(petal.classList.contains('petal-3')) { petal.style.setProperty('--tx', '70px'); petal.style.setProperty('--ty', '-20px'); }
    });

    if (pearlBtn) {
      pearlBtn.addEventListener('click', () => {
        pearlContainer.classList.toggle('open');
      });
    }

    // Close pearl menu if clicking outside
    document.addEventListener('click', (e) => {
      if (!pearlContainer.contains(e.target)) {
        pearlContainer.classList.remove('open');
      }
    });

    // Dynamic WhatsApp Link Generation (Instagram Browser Fix)
    const waText = "Hi Kenjal 💖\n\nI'd love to book a nail appointment with you.\n\n✨ Name:\n📅 Preferred Date:\n💅 Service Interested In:\n\nLooking forward to hearing from you! 💕";
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const waBaseUrl = isMobile ? "whatsapp://send?phone=919914010455&text=" : "https://api.whatsapp.com/send/?phone=919914010455&text=";
    const waUrl = waBaseUrl + encodeURIComponent(waText);
    document.getElementById('wa-btn-primary').href = waUrl;
    document.getElementById('wa-btn-petal').href = waUrl;

  </script>
</body>
